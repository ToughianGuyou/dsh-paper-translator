# Local-source overlay example: replace the entry path and all filesystem paths.
# Relative config paths resolve against the Harness process working directory.
- insert:
    - id: dsh-paper-translator
      name: /absolute/path/dsh-paper-translator/lib/index.js
      config:
        pythonExecutable: /absolute/path/dsh-paper-translator/.venv/bin/python
        keepOriginalMarkdown: true
        allowedInputDirectories:
          - /absolute/path/to/papers
        workDirectory: /absolute/path/to/html-work
        outputDirectory: /absolute/path/to/html-output
        fontPath: ''
        maxPages: 300
        maxFileBytes: 104857600
        maxBatchSize: 20
        timeoutMs: 120000
        maxResponseBytes: 8388608
